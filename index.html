<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shattered Softworks</title>
<meta name="description" content="Shattered Softworks is an independent VR game studio, making Project Inbound for Meta Quest.">
<meta name="theme-color" content="#0c0c0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="intro-end-wide.jpg" media="(min-aspect-ratio: 1/1)">
<link rel="preload" as="image" href="intro-end-square.jpg" media="(max-aspect-ratio: 1/1)">
<style>
  :root{--bg:#0c0c0c;--line:#2a2524;--bone:#f2efe8;--red:#ff4a3a;--muted:#9c9690}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--bone);font-family:'Rajdhani',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  a{color:inherit;text-decoration:none}

  .stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

  /* the intro: video sits full screen, contained, on the same black as its own background */
  .film{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.65,0,.25,1)}
  .film video,.film img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg)}
  .film img{opacity:0;transition:opacity .35s}
  .stage.done .film{transform:translateY(-15%) scale(.78)}
  .stage.still .film img{opacity:1}

  /* join block, comes in under the logo once the intro has played */
  .join{position:absolute;left:0;right:0;bottom:max(6vh,24px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px;
        opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity .8s ease .55s,transform .8s cubic-bezier(.2,.7,.2,1) .55s}
  .stage.done .join{opacity:1;transform:none;pointer-events:auto}
  .label{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:500;letter-spacing:.34em;padding-left:.34em;color:var(--red);text-transform:uppercase}
  .lead{margin-top:10px;font-size:19px;color:var(--muted);max-width:520px}
  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--bone);color:var(--bg);background:var(--bone);transition:background .15s,color .15s}
  .btn:hover{background:#fff}
  .btn.ghost{background:transparent;color:var(--bone)}
  .btn.ghost:hover{background:rgba(242,239,232,.08)}
  .btn.off{border-color:var(--line);color:var(--muted);background:transparent;cursor:default}
  .btn small{font-family:'Rajdhani',sans-serif;font-weight:500;letter-spacing:.04em;text-transform:none;font-size:14px;opacity:.8}
  .foot{margin-top:22px;font-size:14px;color:var(--muted);letter-spacing:.04em}
  .foot a:hover{color:var(--bone)}

  .skip{position:absolute;right:22px;bottom:18px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.3em;color:var(--muted);background:none;border:0;cursor:pointer;padding:10px;transition:opacity .3s}
  .skip:hover{color:var(--bone)}
  .stage.done .skip{opacity:0;pointer-events:none}

  /* short screens: smaller logo, tighter buttons */
  @media (max-height:640px){
    .stage.done .film{transform:translateY(-22%) scale(.62)}
    .lead{display:none}
    .links{margin-top:14px}
    .btn{padding:12px 18px}
  }
  /* phones held upright: square cut of the film */
  @media (max-aspect-ratio:1/1){
    .stage.done .film{transform:translateY(-17%) scale(1.1)}
    .btn{padding:13px 18px;font-size:11px}
    .lead{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){
    .film,.join{transition:none}
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="film">
    <video id="intro" muted playsinline preload="auto" aria-hidden="true"></video>
    <img id="still" alt="Shattered Softworks logo">
  </div>

  <section class="join" aria-label="Join Shattered Softworks">
    <div class="label">Join the drop</div>
    <p class="lead">Devlogs, playtests and a say in what we build next for Project Inbound.</p>
    <div class="links">
      <a class="btn" href="https://discord.gg/SvNK82kVg7">Join the Discord</a>
      <a class="btn ghost" href="https://www.instagram.com/shatteredsoftworks/">Instagram</a>
      <a class="btn ghost" href="https://www.tiktok.com/@shatteredsoftworks">TikTok</a>
      <span class="btn off">YouTube <small>coming soon</small></span>
    </div>
    <p class="foot">&copy; 2026 Shattered Softworks &middot; <a href="mailto:contact@shatteredsoftworks.com">contact@shatteredsoftworks.com</a></p>
  </section>

  <button class="skip" id="skip" type="button">SKIP</button>
</main>

<script>
(function(){
  var stage=document.getElementById('stage'), v=document.getElementById('intro'),
      still=document.getElementById('still'), skip=document.getElementById('skip');

  // upright screens get the square cut, everything else the wide one
  var tall=window.matchMedia('(max-aspect-ratio: 1/1)').matches;
  var cut=tall?'square':'wide';
  v.src='intro-'+cut+'.mp4';
  still.src='intro-end-'+cut+'.jpg';

  var shown=false;
  // bring in the join links and lift the logo (the film keeps playing underneath)
  function reveal(){
    if(shown) return; shown=true;
    stage.classList.add('done');
    try{ sessionStorage.setItem('ssIntroSeen','1'); }catch(e){}
  }
  // jump to the final frame: used for skip, blocked autoplay or a stuck video
  function finish(){
    try{ v.pause(); }catch(e){}
    stage.classList.add('still');
    reveal();
  }
  var LEAD=2; // seconds before the end that the links come in
  v.addEventListener('timeupdate',function(){
    if(v.duration && v.currentTime>=v.duration-LEAD) reveal();
  });

  // seen it this visit, or reduced motion: go straight to the end
  var seen=false; try{ seen=sessionStorage.getItem('ssIntroSeen')==='1'; }catch(e){}
  if(seen || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    v.removeAttribute('src'); v.load(); finish(); return;
  }

  v.addEventListener('ended',reveal);
  v.addEventListener('error',finish);
  skip.addEventListener('click',finish);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'||e.key===' '||e.key==='Enter') finish(); });

  var p=v.play();
  if(p && p.catch) p.catch(finish);       // autoplay blocked (e.g. low power mode): show the end state
  setTimeout(finish,9000);                // never leave anyone waiting on a stuck video
})();
</script>
</body>
</html>
